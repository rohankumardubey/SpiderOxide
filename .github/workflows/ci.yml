name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag whose Linux x64 Python 3.10 wheels and sdist should be smoke-tested
        required: false
        type: string
      previous_tag:
        description: Published release tag whose Linux x64 Python 3.10 wheels should be upgrade-tested
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Check Python formatting
        run: .venv/bin/python -m ruff format --check .

      - name: Lint Python
        run: .venv/bin/python -m ruff check .

      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/spideroxide-native/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path crates/spideroxide-native/Cargo.toml --release -- -D warnings

      - name: Build editable release extension
        run: .venv/bin/maturin develop --release

      - name: Install pinned optional Twisted test dependency
        run: .venv/bin/python -m pip install -r requirements-twisted.txt

      - name: Run integration and compatibility suite
        run: .venv/bin/python tests/run_all.py

      - name: Install pinned third-party integrations
        run: .venv/bin/python -m pip install -r requirements-certification.txt

      - name: Certify third-party integrations
        run: |
          .venv/bin/python certification/run.py \
            --output-dir certification-results/python-${{ matrix.python-version }}

      - name: Upload third-party certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-party-certification-python-${{ matrix.python-version }}
          path: certification-results/python-${{ matrix.python-version }}/
          if-no-files-found: ignore

      - name: Install Scrapy conformance baseline
        run: .venv/bin/python -m pip install -r requirements-conformance.txt

      - name: Run Scrapy conformance suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python tests/verify_compat_version.py
          .venv/bin/python conformance/audit.py
          .venv/bin/python conformance/run.py \
            --output-dir conformance-results/python-${{ matrix.python-version }}

      - name: Upload Scrapy conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapy-conformance-python-${{ matrix.python-version }}
          path: conformance-results/python-${{ matrix.python-version }}/
          if-no-files-found: ignore

      - name: Smoke-test Scrapy comparison
        run: |
          .venv/bin/python benchmarks/benchmark_scrapy.py \
            --sizes 100 --warmups 1 --runs 2 --output-dir /tmp/scrapy-comparison

      - name: Build release wheel
        run: .venv/bin/maturin build --release --out dist

      - name: Verify wheel contents
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()

          assert not any("__pycache__" in name for name in names)
          assert not any(name.endswith((".pyc", ".pyo")) for name in names)
          assert not any(name.startswith("crates/") for name in names)
          assert "spideroxide/py.typed" in names
          PY

      - name: Smoke-test installed wheel outside checkout
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -c \
            "import spideroxide; assert spideroxide.resolve_backend('rust').name == 'rust'"

  distributions:
    name: Wheel ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.14.1
          rust-toolchain: 1.99.0
          manylinux: "2_28"
          args: >-
            --release --locked --compatibility pypi --out dist
            -i ${{ startsWith(matrix.os, 'ubuntu') && format('python{0}', matrix.python-version) || 'python' }}

      - name: Build Scrapy compatibility wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./compat/scrapy

      - name: Smoke-test installed distributions
        shell: bash
        run: |
          python tests/distribution_smoke.py --wheels dist
          if [[ "${{ matrix.os }}" == "ubuntu-24.04" && "${{ matrix.python-version }}" == "3.14" ]]; then
            python tests/distribution_smoke.py --wheels dist \
              --extras twisted remote-control images s3 gcs remote-feeds remote-media dev benchmark \
              --third-party
            python tests/distribution_smoke.py --wheels dist --migrate-scrapy
          fi

      - name: Upload tested wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  source-distribution:
    name: Reproducible source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Build source distributions twice
        run: |
          python -m pip install "maturin==1.14.1"
          mkdir -p sdist-first sdist-second dist extracted
          python -m maturin sdist --out sdist-first
          python -m maturin sdist --out sdist-second
          cmp sdist-first/*.tar.gz sdist-second/*.tar.gz

      - name: Verify native wheel reproducibility
        run: |
          mkdir -p wheel-first wheel-second
          python -m maturin build --release --locked --compatibility pypi -i python --out wheel-first
          python -m maturin build --release --locked --compatibility pypi -i python --out wheel-second
          cmp wheel-first/*.whl wheel-second/*.whl

      - name: Rebuild wheels from source distribution
        run: |
          tar -xzf sdist-first/*.tar.gz -C extracted
          python -m pip wheel --no-deps --wheel-dir dist sdist-first/*.tar.gz
          python -m pip wheel --no-deps --wheel-dir dist ./extracted/spideroxide-*/compat/scrapy
          python tests/distribution_smoke.py --wheels dist --sdist sdist-first/*.tar.gz

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: sdist-first/*.tar.gz
          if-no-files-found: error

  published-release:
    name: Smoke-test published release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir release-dist
          gh release download "$RELEASE_TAG" --dir release-dist \
            --pattern 'spideroxide-*-cp310-cp310-manylinux*_x86_64.whl' \
            --pattern 'spideroxide_scrapy_compat-*-py3-none-any.whl' \
            --pattern 'spideroxide-*.tar.gz'

      - name: Smoke-test published distributions
        run: python tests/distribution_smoke.py --wheels release-dist --sdist release-dist/*.tar.gz

  upgrade:
    name: Upgrade from published release
    if: github.event_name == 'workflow_dispatch' && inputs.previous_tag != ''
    needs: distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download current wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-24.04-py3.10
          path: dist

      - name: Download previous release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          mkdir previous-dist
          gh release download "$PREVIOUS_TAG" --dir previous-dist \
            --pattern 'spideroxide-*-cp310-cp310-manylinux*_x86_64.whl' \
            --pattern 'spideroxide_scrapy_compat-*-py3-none-any.whl'

      - name: Upgrade and smoke-test installed distributions
        run: python tests/distribution_smoke.py --wheels dist --previous-wheels previous-dist
