[package]
name = "spideroxide-native"
version = "0.1.0"
edition = "2024"
description = "Native request-processing backend for SpiderOxide"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
async-compression = { version = "0.4", features = ["brotli", "gzip", "tokio", "zlib", "zstd"] }
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false, features = ["preserve_order"] }
futures-util = "0.3"
fs2 = "0.4"
md-5 = "0.10"
num-bigint = "0.4"
psl = "2"
pyo3 = { version = "0.25", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.25", features = ["tokio-runtime"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "rustls-tls",
    "stream",
    "system-proxy",
] }
robotstxt = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5"
scraper = { version = "0.24", default-features = false, features = ["errors"] }
