[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "spideroxide"
version = "0.1.0"
requires-python = ">=3.10"
description = "An asynchronous Python crawler framework with optional Rust acceleration"
readme = "README.md"
license = "MIT"
keywords = ["crawler", "asyncio", "rust", "pyo3", "scrapy", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1",
    "itemadapter>=0.13,<1",
    "itemloaders>=1.4,<2",
    "parsel>=1.10,<2",
]

[project.optional-dependencies]
images = [
    "Pillow>=10,<13",
]
s3 = [
    "boto3>=1.35,<2",
]
gcs = [
    "google-cloud-storage>=2.18,<4",
]
remote-feeds = [
    "boto3>=1.35,<2",
    "google-cloud-storage>=2.18,<4",
]
dev = [
    "maturin>=1.7,<2",
    "ruff>=0.9,<1",
]
benchmark = [
    "Scrapy>=2.17,<3",
]

[tool.maturin]
manifest-path = "rust_impl/Cargo.toml"
python-source = "."
python-packages = ["spideroxide"]
module-name = "spideroxide._native"
include = [
    { path = "spideroxide/**/*.py", format = ["sdist", "wheel"] },
    { path = "spideroxide/py.typed", format = ["sdist", "wheel"] },
]
exclude = [
    { path = "rust_impl/Cargo.lock", format = "wheel" },
    { path = "rust_impl/Cargo.toml", format = "wheel" },
    { path = "rust_impl/src/**", format = "wheel" },
    { path = "rust_impl/target/**", format = "wheel" },
    { path = "spideroxide/**/__pycache__/**", format = "wheel" },
    { path = "spideroxide/**/*.pyc", format = "wheel" },
    { path = "spideroxide/**/*.pyo", format = "wheel" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmark/common.py" = ["E402"]
"benchmark/memory_worker.py" = ["E402"]
"benchmark/verify_correctness.py" = ["E402"]
"benchmark/verify_crawler.py" = ["E402"]
"benchmark/verify_crawl_spider.py" = ["E402"]
"benchmark/verify_extensions.py" = ["E402"]
"benchmark/verify_integration.py" = ["E402"]
"benchmark/verify_native_downloader.py" = ["E402"]
"benchmark/verify_native_engine.py" = ["E402"]
"benchmark/verify_scheduler_queues.py" = ["E402"]
"benchmark/verify_selectors.py" = ["E402"]
"benchmark/verify_spider_middleware.py" = ["E402"]
"benchmark/verify_retry.py" = ["E402"]
"benchmark/verify_native_policy.py" = ["E402"]
"benchmark/verify_depth.py" = ["E402"]
"benchmark/verify_proxy.py" = ["E402"]
"benchmark/verify_feed_exports.py" = ["E402"]
"benchmark/verify_http_models.py" = ["E402"]
"benchmark/verify_http_cache.py" = ["E402"]
"benchmark/verify_media_pipelines.py" = ["E402"]
"benchmark/verify_remote_feeds.py" = ["E402"]
"benchmark/verify_cookies.py" = ["E402"]
"benchmark/verify_job_state.py" = ["E402"]
"benchmark/benchmark_scrapy.py" = ["E402"]
