[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "spideroxide"
version = "0.1.0"
requires-python = ">=3.10"
description = "An asynchronous Python crawler framework with optional Rust acceleration"
readme = "README.md"
license = "MIT"
keywords = ["crawler", "asyncio", "rust", "pyo3", "scrapy", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1",
    "itemadapter>=0.13,<1",
    "itemloaders>=1.4,<2",
    "parsel>=1.10,<2",
]

[project.urls]
Homepage = "https://github.com/rohankumardubey/SpiderOxide"
Repository = "https://github.com/rohankumardubey/SpiderOxide"
Issues = "https://github.com/rohankumardubey/SpiderOxide/issues"

[project.optional-dependencies]
images = [
    "Pillow>=10,<13",
]
s3 = [
    "boto3>=1.35,<2",
]
gcs = [
    "google-cloud-storage>=2.18,<4",
]
remote-feeds = [
    "boto3>=1.35,<2",
    "google-cloud-storage>=2.18,<4",
]
dev = [
    "maturin>=1.7,<2",
    "ruff>=0.9,<1",
]
benchmark = [
    "Scrapy>=2.17,<3",
]

[tool.maturin]
manifest-path = "crates/spideroxide-native/Cargo.toml"
python-source = "src"
python-packages = ["spideroxide"]
module-name = "spideroxide._native"
include = [
    { path = "src/spideroxide/**/*.py", format = ["sdist", "wheel"] },
    { path = "src/spideroxide/py.typed", format = ["sdist", "wheel"] },
]
exclude = [
    { path = "Cargo.lock", format = "wheel" },
    { path = "Cargo.toml", format = "wheel" },
    { path = "crates/spideroxide-native/Cargo.toml", format = "wheel" },
    { path = "crates/spideroxide-native/src/**", format = "wheel" },
    { path = "crates/spideroxide-native/target/**", format = "wheel" },
    { path = "src/spideroxide/**/__pycache__/**", format = "wheel" },
    { path = "src/spideroxide/**/*.pyc", format = "wheel" },
    { path = "src/spideroxide/**/*.pyo", format = "wheel" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402"]
"tests/*.py" = ["E402"]
